<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peaches Atelier</title>
  <style>
    :root {
      --bg: #FFFFFF;
      --sky-blue: #BCE3F5;
      --soft-yellow: #FFF1A8;
      --black: #111111;
      --gray: #666666;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--black);
      line-height: 1.5;
    }
    header {
      padding: 1.5rem 1rem;
      border-bottom: 1px solid var(--sky-blue);
      text-align: center;
    }
    .logo {
      font-size: 1.8rem;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: lowercase;
    }
    .tagline {
      font-size: 0.85rem;
      color: var(--gray);
      margin-top: 0.25rem;
    }
    .hero {
      background: linear-gradient(180deg, var(--sky-blue) 0%, var(--bg) 100%);
      padding: 2.5rem 1.25rem;
      text-align: center;
    }
    .hero h1 {
      font-size: 2rem;
      margin-bottom: 0.75rem;
    }
    .hero p {
      font-size: 1rem;
      color: var(--gray);
      max-width: 500px;
      margin: 0 auto 1.5rem auto;
    }
    .cta-btn {
      display: inline-block;
      background-color: var(--soft-yellow);
      color: var(--black);
      padding: 0.8rem 1.5rem;
      font-weight: bold;
      border-radius: 30px;
      text-decoration: none;
      border: 1px solid var(--black);
    }
    .image-card {
      margin: 1.5rem 1.25rem;
      border: 2px dashed var(--sky-blue);
      border-radius: 12px;
      height: 250px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #F8FDFF;
      background-size: cover;
      background-position: center;
      position: relative;
    }
    .image-card input {
      display: none;
    }
    .upload-btn {
      background-color: var(--black);
      color: var(--bg);
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .section-title {
      font-size: 1.3rem;
      text-align: center;
      margin-top: 2rem;
    }
    footer {
      background-color: var(--black);
      color: #ffffff;
      padding: 2rem 1rem;
      text-align: center;
      margin-top: 3rem;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">peaches atelier</div>
    <div class="tagline">fashion • culture • art</div>
  </header>

  <section class="hero">
    <h1>Fashion shaped by craft & imagination</h1>
    <p>An independent fashion atelier creating expressive pieces between artistry and contemporary style.</p>
    <a href="#collections" class="cta-btn">Explore Collections</a>
  </section>

  <h2 class="section-title" id="collections">Featured Look</h2>
  
  <div class="image-card" id="card1">
    <label class="upload-btn">
      📷 Select Photo from Phone
      <input type="file" accept="image/*" onchange="previewImage(event, 'card1')">
    </label>
  </div>

  <footer>
    <p>© 2026 Peaches Atelier. All rights reserved.</p>
  </footer>

  <script>
    function previewImage(event, cardId) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const card = document.getElementById(cardId);
          card.style.backgroundImage = `url('${e.target.result}')`;
          card.querySelector('.upload-btn').style.opacity = '0.5';
        }
        reader.readAsDataURL(file);
      }
    }
  </script>

</body>
</html>
